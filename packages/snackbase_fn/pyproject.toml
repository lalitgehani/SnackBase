[project]
name = "snackbase-fn"
version = "0.1.0"
description = "Baseline SDK for SnackBase Functions"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snackbase_fn"]
