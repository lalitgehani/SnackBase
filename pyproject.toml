[project]
name = "snackbase"
version = "0.11.0"
description = "Open-source Backend-as-a-Service (BaaS) - Self-hosted alternative to PocketBase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.127.0",
    "uvicorn[standard]>=0.50.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "click>=8.1.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "alembic>=1.17.2",
    "cryptography>=46.0.3",
    "httpx>=0.28.1",
    "signxml>=4.2.0",
    "lxml>=6.0.2",
    "jinja2>=3.1.6",
    "aiosmtplib>=5.0.0",
    "boto3>=1.42.24",
    "resend>=2.0.0",
    "websockets>=12.0",
    "sse-starlette>=2.0.0",
    "puremagic>=2.2.0",
]

[project.scripts]
snackbase = "snackbase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snackbase", "src/snackbase_fn"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "jinja2>=3.1.6",
    "respx>=0.22.0",
    "types-aiobotocore-ses>=3.1.0",
    "lxml-stubs>=0.5.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["snackbase"]

[tool.ruff.lint.per-file-ignores]
# Names below are fixed by an external contract; renaming them breaks behaviour rather
# than improving style. Scoped per file so the rules stay active everywhere else.

# N818: `AbortHookException` is part of the hooks API, which is stable at v1.0.
# Renaming it to an `Error` suffix would break every published hook.
"src/snackbase/domain/entities/hook_context.py" = ["N818"]

# N803: `SAMLResponse` / `RelayState` are SAML POST binding field names. FastAPI binds
# `Form(...)` parameters by name, so these must match the protocol exactly.
"src/snackbase/infrastructure/api/routes/saml_router.py" = ["N803"]

# N803: `RoleModel` is a model class passed as a parameter, so PascalCase is correct.
# N806: `SYSTEM_ACCOUNT_ID` is a local constant mirroring the module-level constant.
"src/snackbase/infrastructure/persistence/database.py" = ["N803", "N806"]
"src/snackbase/infrastructure/services/email_service.py" = ["N806"]

# N803: mirrors the boto3 S3 API, whose keyword arguments are PascalCase.
"tests/integration/test_file_storage_integration.py" = ["N803"]

# N806: patched mock classes bound in tests; PascalCase reads as the class it stands in for.
"tests/unit/api/routes/test_auth_router.py" = ["N806"]
"tests/unit/domain/services/test_collection_export_import.py" = ["N806"]
"tests/unit/infrastructure/configuration/providers/saml/test_azure_ad_provider.py" = ["N806"]
"tests/verification/verify_invitation_account_name.py" = ["N806"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "enable_audit_hooks: Enable audit logging hooks for this test (adds overhead)",
    "security: Security suite test (applied automatically to tests/security/)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    # Starlette >=1.6 wants `httpx2` behind its TestClient. `httpx` is a direct
    # runtime dependency here (webhooks, functions egress), so switching test
    # clients is a separate migration; the warning is fired by FastAPI's own
    # `fastapi.testclient` module on import.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]
