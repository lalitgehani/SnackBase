# Build and push SnackBase images to GitHub Container Registry (ghcr.io).
#
# Triggers & tags:
#   push to main  → ghcr.io/<owner>/snackbase:latest
#   push to demo  → ghcr.io/<owner>/snackbase:demo
#   push tag v*   → ghcr.io/<owner>/snackbase:<semver>
#                   e.g. v0.7.1 → :0.7.1, :0.7, :0
#
# Demo branch builds with VITE_IS_DEMO=true so the UI demo flag is baked in.
# main and version tags build with VITE_IS_DEMO=false.
#
# Usage after a release:
#   git tag -a v0.7.1 -m "Release 0.7.1"
#   git push origin v0.7.1

name: Docker publish

on:
  push:
    branches:
      - main
      - demo
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercase image name required by GHCR
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest ← main, demo ← demo branch, semver ← git tags like v0.7.1
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/demo' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo' }}

      - name: Resolve VITE_IS_DEMO build arg
        id: demo_flag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/demo" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_IS_DEMO=${{ steps.demo_flag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
