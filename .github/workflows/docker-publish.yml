# Build and push SnackBase images to GitHub Container Registry (ghcr.io).
#
# This workflow publishes two images:
#
# 1) Instance image — ghcr.io/<owner>/snackbase (or <owner>/<repo>)
#    Triggers & tags:
#      push to main  → :latest
#      push to demo  → :demo
#      push tag v*   → :<semver> (e.g. v0.12.1 → :0.12.1, :0.12, :0)
#    Demo branch builds with VITE_IS_DEMO=true; main and version tags use false.
#
# 2) Platform Studio image — ghcr.io/<owner>/snackbase-platform-studio
#    Triggers & tags (main and v* tags only, including workflow_dispatch on those refs — not demo):
#      push to main / workflow_dispatch on main → :latest (+ sha- short sha)
#      push tag v* → :<semver>
#
# Platforms: linux/amd64 + linux/arm64 (multi-arch manifest list).
#
# Usage after a release:
#   git tag -a v0.12.1 -m "Release 0.12.1"
#   git push origin v0.12.1
#
# Manual rebuild of multi-arch tags: Actions → Docker publish → Run workflow

name: Docker publish

on:
  push:
    branches:
      - main
      - demo
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercase image name required by GHCR
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required so buildx can cross-compile arm64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest ← main, demo ← demo branch, semver ← git tags like v0.12.1
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/demo' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo' }}

      - name: Resolve VITE_IS_DEMO build arg
        id: demo_flag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/demo" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Multi-arch requires push (cannot --load a multi-platform image locally on the runner).
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_IS_DEMO=${{ steps.demo_flag.outputs.value }}
          # Per-platform cache scopes avoid amd64/arm64 thrashing the same GHA cache entry.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-platform:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required so buildx can cross-compile arm64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/snackbase-platform-studio
          # latest ← main, semver ← git tags like v0.12.1 (no demo tag)
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ui/Dockerfile.platform
          platforms: linux/amd64,linux/arm64
          push: true
          # Multi-arch requires push (cannot --load a multi-platform image locally on the runner).
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Distinct GHA cache scope so this job does not collide with the instance image cache.
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform
