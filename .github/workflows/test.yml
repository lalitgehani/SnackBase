# Test workflow: runs the security suite as a distinct, attributable job and
# the full pytest suite separately, plus a dependency-advisory gate.
#
# The security job is deliberately split out so a broken isolation boundary is
# visible at a glance in the checks list rather than buried in a 2,000-test run.
#
# xfail(strict=True) semantics matter here: a security test written against a
# not-yet-shipped fix fails this job the moment it starts passing, which is the
# signal to drop the marker and promote it to a permanent regression guard.

name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Reset development state
        run: uv run python cleanup_dev.py -y

      - name: Run security suite
        run: uv run pytest -m security -v

      - name: Upload consolidated security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: tests/security-reports/
          if-no-files-found: warn

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # An ignore-list entry is a decision to ship a known issue, so it must
      # say why. Reject any entry that is just an advisory ID.
      - name: Validate advisory ignore-list
        run: |
          python - <<'EOF'
          import pathlib
          import sys

          unjustified = []
          for raw in pathlib.Path(".pip-audit-ignore").read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              advisory, sep, why = line.partition("#")
              if not sep or not why.strip():
                  unjustified.append(advisory.strip())

          if unjustified:
              print(f"::error::ignore-list entries lack a justification: {unjustified}")
              sys.exit(1)
          print("Advisory ignore-list is valid.")
          EOF

      # Tool versions are pinned so a newly published advisory database cannot
      # turn a green PR red without a commit. Bump on a schedule.
      - name: Audit Python dependencies
        run: |
          IGNORES=$(grep -vE '^\s*(#|$)' .pip-audit-ignore | sed 's/#.*//' | \
            xargs -r -n1 printf -- '--ignore-vuln %s ')
          # `uv export` emits a fully-resolved pin list, so --no-deps lets
          # pip-audit read it directly instead of building a throwaway venv.
          uv export --format requirements-txt --no-hashes > /tmp/requirements.txt
          uv tool run --from pip-audit==2.10.1 pip-audit \
            --requirement /tmp/requirements.txt \
            --disable-pip --no-deps \
            $IGNORES

      - name: Audit frontend dependencies
        run: |
          npm ci --prefix ui
          npm audit --prefix ui --audit-level=high

  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Reset development state
        run: uv run python cleanup_dev.py -y

      # Lint and type-check are reported but non-blocking: the repository
      # carries a large pre-existing ruff/strict-mypy backlog that predates
      # this workflow. Surfacing it in CI is useful; failing every PR on it is
      # not. Flip continue-on-error off once the backlog is cleared.
      - name: Lint (report-only)
        continue-on-error: true
        run: uv run ruff check .

      - name: Type check (report-only)
        continue-on-error: true
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest -q
