# Publish snackbase to PyPI.
#
# Authentication uses the `PYPI_API_TOKEN` repository secret. Trusted
# publishing (OIDC) is preferred long term: register a publisher on
# https://pypi.org/manage/project/snackbase/publishing/ (Owner: lalitgehani,
# Repository: SnackBase, Workflow: publish.yml, Environment: pypi), then drop
# the `password:` input below and restore `id-token: write`.
#
# Then: git tag vX.Y.Z && git push origin vX.Y.Z

name: publish
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
